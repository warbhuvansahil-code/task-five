name: Auto Merge to Development

on:
  push:
    branches:
      - 'dev-*' # Triggers on any branch starting with dev-, such as dev-yourname1 or dev-yourname2

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full commit history so git checkout works

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into development
        run: |
          git fetch origin development:development
          git checkout development
          git merge ${{ github.ref_name }} --no-ff -m "Auto-merge ${{ github.ref_name }} into development"
          git push origin development